#Gradle
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4g
#Maven Publishing
# geode continues the version line it shipped under in Amethyst (last: 1.19.0), so
# .deb/.rpm/Homebrew/GHCR users upgrade instead of seeing a downgrade.
GROUP=com.vitorpamplona.geode
POM_ARTIFACT_ID=geode
VERSION_NAME=1.20.0
