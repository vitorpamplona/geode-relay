name: Test/Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: 21

      # Remote Gradle build cache: writes on push to main, reads on PRs and
      # other branches.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Linter (gradle)
        run: ./gradlew spotlessCheck

  # The relay suite also runs the quartz client tests that need a real socket
  # relay (KtorRelay), which stayed with geode when quartz moved to
  # vitorpamplona/quartz. Its default suite carries CPU-heavy throughput
  # benchmarks (a mirror sync, WireReqFloor, NegentropyServerReconcile).
  test-geode:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # -DsyncN shrinks MirrorSyncThroughputTest's corpus from its 1,000,000-event
      # default. At 1M the sink cannot keep up with the in-process source, and the
      # MirrorWorker's deliberately unbounded intake channel buffers the backlog until
      # the runner's heap is gone: throughput collapses (13,800 -> 86 ev/s) and an
      # OutOfMemoryError lands on a coroutine thread, where the UncaughtExceptionHandler
      # swallows it. JUnit never sees a failure, so the JVM wedges and the job burns to
      # the timeout with no signal rather than failing. 100k keeps a real ev/s number
      # while bounding the worst-case backlog to a tenth of what died.
      #
      # Only CI is shrunk: -DsyncN is unset everywhere else, so a local or manual run
      # still measures the full 1M — the number written up in
      # relayBench/plans/2026-07-04-sync-throughput-1m.md.
      - name: Test geode + relayBench (gradle)
        run: ./gradlew :geode:test :relayBench:test -DsyncN=100000

      # The publication (jar, sources, test fixtures, POM) and the operator
      # image are what a release ships; build both so a break shows up here
      # rather than on the tag.
      - name: Build publication and app-image (gradle)
        run: ./gradlew :geode:publishToMavenLocal :geode:geodeImage :relayBench:installDist

      - name: Smoke-test the geode image
        run: |
          set -euo pipefail
          LAUNCHER="geode/build/geode-image/geode/bin/geode"
          "$LAUNCHER" --version
          "$LAUNCHER" --port 17447 &
          PID=$!
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS -H 'Accept: application/nostr+json' http://127.0.0.1:17447/ -o /tmp/nip11.json; then ok=1; break; fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          [[ "$ok" == 1 ]] || { echo "::error::geode image did not serve NIP-11 within 20s"; exit 1; }
          grep -q '"supported_nips"' /tmp/nip11.json || { echo "::error::NIP-11 doc missing supported_nips"; exit 1; }

      - name: Upload Test Reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: geode Test Reports
          path: |
            geode/build/reports
            relayBench/build/reports
